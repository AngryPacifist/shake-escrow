[package]
name = "shake-escrow"
version = "0.1.0"
description = "Peer-to-peer wager escrow for Solana: two equal stakes, a named resolver, permissionless timeout refunds"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "shake_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed", "event-cpi"] }
anchor-spl = "1.1.2"

[dev-dependencies]
litesvm = "0.10.0"
litesvm-token = "0.10.0"
ureq = { version = "2.10", features = ["json"] }
serde_json = "1"
bincode = "1.3"
base64 = "0.22"
bs58 = "0.5"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
